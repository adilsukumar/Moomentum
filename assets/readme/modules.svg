<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="775" viewBox="0 0 1120 775" role="img" aria-labelledby="t d"><title id="t">MotionSense, TemperatureSense, VitalSense, LightSense, PressureSense and SkinSense. Their original scope and evidence limits are retained.</title><desc id="d">Concept animal-care and sensor artwork, not live sensor readings, measured accuracy or veterinary validation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes sense{0%,100%{opacity:.45}50%{opacity:1}}.sense{animation:sense 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.03)}}.breathe{animation:breathe 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.sense,.breathe{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="524" height="230" rx="14" fill="#151420" stroke="#363348"/><g class="sense" style="animation-delay:-0.0s"><g transform="translate(46 34) scale(0.8863636363636364)"><path d="M5 33l11-24 10 25 13-23M3 41h38M22 3v38" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="104" y="62" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">MotionSense-AI</text><text x="48" y="122" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Canine IMU behaviour</text><text x="48" y="156" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">classification, feature extraction</text><text x="48" y="190" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">and model export.</text><rect x="572" y="12" width="524" height="230" rx="14" fill="#151420" stroke="#363348"/><g class="sense" style="animation-delay:-0.9s"><g transform="translate(594 34) scale(0.8863636363636364)"><path d="M17 7a5 5 0 0 1 10 0v19a9 9 0 1 1-10 0zM22 14v18M32 10h7M32 18h5" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="652" y="62" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">TemperatureSense-AI</text><text x="596" y="122" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Environment-risk guidance and</text><text x="596" y="156" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">individual surface-temperature</text><text x="596" y="190" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">trends.</text><rect x="24" y="262" width="524" height="230" rx="14" fill="#151420" stroke="#363348"/><g class="sense" style="animation-delay:-1.8s"><g transform="translate(46 284) scale(0.8863636363636364)"><path d="M2 23h9l4-7 5 17 5-28 6 26 4-8h8" fill="none" stroke="#F3D962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="104" y="312" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">VitalSense-AI</text><text x="48" y="372" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Pulse and respiration processing,</text><text x="48" y="406" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">signal quality and trend analysis.</text><rect x="572" y="262" width="524" height="230" rx="14" fill="#151420" stroke="#363348"/><g class="sense" style="animation-delay:-2.7s"><g transform="translate(594 284) scale(0.8863636363636364)"><path d="M15 29a12 12 0 1 1 15 0v7H15zM16 41h13M22 2V0M3 15l-3-2M41 15l3-2" fill="none" stroke="#A783F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="652" y="312" fill="#A783F7" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">LightSense-AI</text><text x="596" y="372" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">LED configuration backend and</text><text x="596" y="406" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">ESP32 firmware integration.</text><rect x="24" y="512" width="524" height="230" rx="14" fill="#151420" stroke="#363348"/><g class="sense" style="animation-delay:-3.6s"><g transform="translate(46 534) scale(0.8863636363636364)"><path d="M5 32a18 18 0 1 1 34 0M9 32h26M22 28l10-13M8 18l5 3M22 7v6" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="104" y="562" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">PressureSense-AI</text><text x="48" y="622" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Historical goat-motion</text><text x="48" y="656" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">classification work; inspect the</text><text x="48" y="690" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">module scope.</text><rect x="572" y="512" width="524" height="230" rx="14" fill="#151420" stroke="#363348"/><g class="sense" style="animation-delay:-4.5s"><g transform="translate(594 534) scale(0.8863636363636364)"><path d="M4 31Q11 19 18 29Q26 40 40 22M4 17Q12 7 22 17Q31 26 40 12M11 39h1M30 3h1" fill="none" stroke="#BCFCF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="652" y="562" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="start">SkinSense-AI</text><text x="596" y="622" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">Skin-analysis experimental assets</text><text x="596" y="656" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start">and their documentation.</text></svg>