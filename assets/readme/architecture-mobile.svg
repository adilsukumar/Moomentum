<svg xmlns="http://www.w3.org/2000/svg" width="640" height="682" viewBox="0 0 640 682" role="img" aria-labelledby="t d"><title id="t">The web interface, independent sensor modules and supporting evidence are separate parts of the repository.</title><desc id="d">Concept animal-care and sensor artwork, not live sensor readings, measured accuracy or veterinary validation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes sense{0%,100%{opacity:.45}50%{opacity:1}}.sense{animation:sense 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.03)}}.breathe{animation:breathe 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.sense,.breathe{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="200" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(46 34) scale(0.8636363636363636)"><path d="M4 5h36v28H4zM22 33v9M12 42h20M11 24l7-8 8 5 7-10" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="46" y="106" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">THE WEB INTERFACE</text><text x="46" y="155" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">WanCare UI prototypes, routes and</text><text x="46" y="189" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">application components.</text><rect x="24" y="230" width="592" height="200" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(46 252) scale(0.8636363636363636)"><path d="M7 8h9v9H7zM29 8h9v9h-9zM18 30h9v9h-9zM16 12h13M22 12v18" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="46" y="324" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">THE SENSOR MODULES</text><text x="46" y="373" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Separate experiments, dependencies and</text><text x="46" y="407" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">source documentation.</text><rect x="24" y="448" width="592" height="200" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(46 470) scale(0.8636363636363636)"><path d="M5 6h33v33H5zM12 22l7 7 13-15" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="46" y="542" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">THE EVIDENCE</text><text x="46" y="591" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Tests, walkthroughs, attributed data and</text><text x="46" y="625" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">validation limits.</text></svg>