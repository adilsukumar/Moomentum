<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150" role="img" aria-labelledby="t d"><title id="t">TemperatureSense. Surface trends, context and reference data</title><desc id="d">Concept animal-care and sensor artwork, not live sensor readings, measured accuracy or veterinary validation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes sense{0%,100%{opacity:.45}50%{opacity:1}}.sense{animation:sense 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.03)}}.breathe{animation:breathe 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.sense,.breathe{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="145" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(22 24) scale(0.8636363636363636)"><path d="M17 7a5 5 0 0 1 10 0v19a9 9 0 1 1-10 0zM22 14v18M32 10h7M32 18h5" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="78" y="51" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">TemperatureSense</text><text x="22" y="115" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Surface trends, context and reference data</text></svg>