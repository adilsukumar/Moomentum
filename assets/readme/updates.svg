<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="349" viewBox="0 0 1120 349" role="img" aria-labelledby="t d"><title id="t">Portable MotionSense notebook and attributed temperature reference source. No model retraining or new accuracy claim is implied.</title><desc id="d">Concept animal-care and sensor artwork, not live sensor readings, measured accuracy or veterinary validation.</desc><style>@keyframes candle{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.08)}}.candle{animation:candle 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}.glow{animation:glow 5s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 36s linear infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.candle,.glow,.orbit{animation:none!important}}@keyframes sense{0%,100%{opacity:.45}50%{opacity:1}}.sense{animation:sense 7s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.03)}}.breathe{animation:breathe 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion:reduce){.sense,.breathe{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="53" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start">SOURCE, ATTRIBUTION AND WHAT WAS ACTUALLY UPDATED</text><rect x="24" y="84" width="524" height="230" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(46 106) scale(0.8636363636363636)"><path d="M8 4h28v37H8zM4 11h8M4 22h8M4 33h8M17 13h12M17 22h12M17 31h8" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="46" y="178" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">MOTIONSENSE WALKTHROUGH</text><text x="46" y="227" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Portable notebook with cleared</text><text x="46" y="261" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">outputs and feature/export</text><text x="46" y="295" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">helpers.</text><rect x="572" y="84" width="524" height="230" rx="14" fill="#151420" stroke="#363348"/><g transform="translate(594 106) scale(0.8636363636363636)"><path d="M5 11h34v29H5zM3 3h38v8H3zM17 20h10" fill="none" stroke="#FF4081" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="594" y="178" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">TEMPERATURE REFERENCE</text><text x="594" y="227" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Attributed 45-row Labrador phase</text><text x="594" y="261" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">export and workbook-generation</text><text x="594" y="295" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">source.</text></svg>